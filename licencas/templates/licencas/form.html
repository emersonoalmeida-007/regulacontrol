{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<form method="post" enctype="multipart/form-data" class="cartao formulario" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="erro" role="alert">{{ form.non_field_errors }}</div>{% endif %}
  {% for campo in form %}{% include "includes/campo.html" %}{% endfor %}
  <div class="acoes">
    <button type="submit" class="botao">Salvar</button>
    <a class="botao secundario" href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'licencas:lista' %}{% endif %}">Cancelar</a>
  </div>
</form>
{% endblock %}
