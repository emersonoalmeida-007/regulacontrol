{% extends "base.html" %}
{% load static %}
{% block titulo %}Licenças{% endblock %}
{% block conteudo %}
<div class="cabecalho">
  <h1>Licenças</h1>
  <div class="acoes">
    <a class="botao secundario" id="link-exportar" href="{% url 'licencas:exportar' %}?{{ request.GET.urlencode }}">Exportar CSV</a>
    {% if pode_editar %}<a class="botao" href="{% url 'licencas:criar' %}">Nova licença</a>{% endif %}
  </div>
</div>

<form id="filtros" class="filtros" method="get" role="search" aria-label="Filtrar licenças">
  <div class="campo">
    <label for="f-q">Buscar</label>
    <input type="search" id="f-q" name="q" value="{{ filtros.q|default:'' }}" placeholder="Tipo, número, unidade ou órgão">
  </div>
  <div class="campo">
    <label for="f-status">Status</label>
    <select id="f-status" name="status">
      <option value="">Todos</option>
      {% for valor, rotulo in status_choices %}<option value="{{ valor }}" {% if filtros.status == valor %}selected{% endif %}>{{ rotulo }}</option>{% endfor %}
    </select>
  </div>
  <div class="campo">
    <label for="f-unidade">Unidade</label>
    <select id="f-unidade" name="unidade">
      <option value="">Todas</option>
      {% for u in unidades %}<option value="{{ u.pk }}" {% if filtros.unidade == u.pk|stringformat:'s' %}selected{% endif %}>{{ u.nome }}</option>{% endfor %}
    </select>
  </div>
  <div class="campo">
    <label for="f-orgao">Órgão</label>
    <select id="f-orgao" name="orgao">
      <option value="">Todos</option>
      {% for o in orgaos %}<option value="{{ o.pk }}" {% if filtros.orgao == o.pk|stringformat:'s' %}selected{% endif %}>{{ o.sigla }}</option>{% endfor %}
    </select>
  </div>
  <noscript><button type="submit" class="botao">Filtrar</button></noscript>
</form>

<div id="resultado" aria-live="polite">
  {% include "licencas/_tabela.html" %}
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'js/filtros.js' %}"></script>{% endblock %}
